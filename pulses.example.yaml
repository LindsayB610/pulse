# Public demo pulse configuration.
# Copy to a private pulses.yaml outside git before adding real obligations.

pulses:
  - id: weekly-demo-check
    title: Weekly demo check
    active: true
    schedule:
      version: 2
      type: weekly
      interval: 1
      startDate: "2026-09-06"
      weekStartsOn: sunday
      daysOfWeek:
        - sunday
      time: "09:00"
      timezone: America/Los_Angeles
      end:
        type: count
        occurrences: 4
    notificationPolicy:
      channels:
        - console
      repeatEveryMinutes: 5
