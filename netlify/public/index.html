<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Pulse runner</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e11; color: #f7f5f7; }
      main { width: min(620px, calc(100% - 48px)); }
      .eyebrow { color: #ff4aa2; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(2.4rem, 8vw, 4.8rem); line-height: .98; }
      p { color: #b8b4bd; font-size: 1.1rem; line-height: 1.65; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; color: #68e5aa; font-weight: 750; }
      .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 6px #68e5aa1f; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Your Pulse runner</div>
      <h1>The runner is online.</h1>
      <p>Return to Workshop to finish the secure connection and send a test notification. This page contains no reminder data or account credentials.</p>
      <div class="status">Ready for Workshop</div>
    </main>
  </body>
</html>
