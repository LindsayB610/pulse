# Public-safe forced test pulse.
# Copy this to a private path and change the date/time to a few minutes ahead.

pulses:
  - id: forced-test-check
    title: Forced test check
    active: true
    schedule:
      version: 2
      type: once
      date: "2026-09-01"
      time: "09:00"
      timezone: America/Los_Angeles
    notificationPolicy:
      channels:
        - console
      repeatEveryMinutes: 5
